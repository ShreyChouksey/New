{% extends "base.html" %}
{% block title %}404 — Not Found{% endblock %}
{% block content %}
<section class="section error-page">
    <h1 class="error-code">404</h1>
    <p class="error-message">This address leads nowhere in the archive.</p>
    <p class="error-detail">The page you're looking for doesn't exist, but every <em>image</em> does.</p>
    <div class="error-actions">
        <a href="{{ url_for('index') }}" class="btn btn-primary">Return Home</a>
        <a href="{{ url_for('random_page') }}" class="btn btn-outline">Try Random Images</a>
    </div>
</section>
{% endblock %}
